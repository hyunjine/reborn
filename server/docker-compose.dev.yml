services:
  postgres:
    image: postgres:17
    container_name: reborn-postgres-dev
    environment:
      POSTGRES_DB: reborn_dev
      POSTGRES_USER: reborn
      POSTGRES_PASSWORD: reborn
    ports:
      - "5432:5432"
    volumes:
      - reborn-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reborn -d reborn_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      args:
        SPRING_PROFILE: dev
    container_name: reborn-server-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reborn_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reborn-dev-pgdata:

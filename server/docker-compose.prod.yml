name: reborn-prod

services:
  postgres:
    image: postgres:17
    container_name: reborn-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-reborn}
      POSTGRES_USER: ${DB_USERNAME:-reborn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reborn}
    ports:
      - "5433:5432"
    volumes:
      - reborn-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reborn} -d ${DB_NAME:-reborn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      args:
        SPRING_PROFILE: prod
    container_name: reborn-server-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-reborn}
      DB_USERNAME: ${DB_USERNAME:-reborn}
      DB_PASSWORD: ${DB_PASSWORD:-reborn}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reborn-prod-pgdata:
